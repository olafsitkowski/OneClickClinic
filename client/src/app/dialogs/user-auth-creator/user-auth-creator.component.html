<div class="modal-body">
  <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>{{ 'USER_LOGIN' | translate }}*</label>
      <input
        #loginInput
        type="text"
        class="form-control large-input"
        formControlName="userName"
        [ngClass]="{
          error:
            authForm.controls['userName'].invalid &&
            authForm.controls['userName'].touched
        }"
      />
    </div>
    <div class="form-group">
      <label>{{ 'EMAIL' | translate }}*</label>
      <input
        #emailInput
        type="email"
        class="form-control large-input"
        formControlName="email"
        [ngClass]="{
          error:
            authForm.controls['email'].invalid &&
            authForm.controls['email'].touched
        }"
      />
    </div>
    <div class="form-group">
      <label>{{ 'PASSWORD' | translate }}*</label>
      <input
        #passwordInput
        type="password"
        class="form-control large-input"
        formControlName="password"
        [ngClass]="{
          error:
            authForm.controls['password'].invalid &&
            authForm.controls['password'].touched
        }"
        [tooltip]="'PASSWORD.REQUIREMENTS' | translate"
        [delay]="500"
      />
    </div>
    <div class="form-group">
      <label>{{ 'CONFIRM_PASSWORD' | translate }}*</label>
      <input
        #confirmPasswordInput
        type="password"
        class="form-control large-input"
        formControlName="confirmPassword"
        [ngClass]="{
          error:
            authForm.controls['confirmPassword'].invalid &&
            authForm.controls['confirmPassword'].touched
        }"
        [tooltip]="'PASSWORD.REQUIREMENTS' | translate"
        [delay]="500"
      />
    </div>
  </form>
</div>

<mat-dialog-actions align="end">
  <div>
    <button class="btn btn-outline-info" (click)="closeDialog()">
      {{ 'CLOSE' | translate }}
    </button>
  </div>
  <div class="button">
    <button class="btn btn-primary" type="submit" (click)="onSubmit()">
      {{ 'CONFIRM' | translate }}
    </button>
  </div>
  <div></div>
</mat-dialog-actions>
